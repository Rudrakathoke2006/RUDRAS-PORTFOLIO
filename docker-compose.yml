version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - fastapi-backend
      - spring-boot-backend

  fastapi-backend:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://rudra:secret@postgres:5432/rudradb
    depends_on:
      - postgres

  spring-boot-backend:
    build:
      context: ./server-java
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rudradb
      - SPRING_DATASOURCE_USERNAME=rudra
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres

  postgres:
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rudra
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=rudradb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
